[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = [
    "cl_strategy",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
