name: Synthetic router and reverse-engineering

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  synthetic-router-reverse-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run synthetic router tests
        run: |
          python -m pytest -q \
            skill_memory/tests/test_routing.py \
            skill_memory/tests/test_batched_listwise_routing.py \
            skill_memory/tests/test_continuous_fingerprint_routing.py \
            | tee synthetic_router_tests.txt

      - name: Run synthetic reverse-engineering tests
        run: |
          python -m pytest -q \
            skill_memory/tests/test_reverse_engineering.py \
            skill_memory/tests/test_weight_reverse_engineering.py \
            skill_memory/tests/test_reverse_router_output_dim.py \
            | tee synthetic_reverse_engineering_tests.txt

      - name: Upload synthetic test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-router-reverse-engineering-${{ github.run_id }}
          path: |
            synthetic_router_tests.txt
            synthetic_reverse_engineering_tests.txt
          if-no-files-found: warn
          retention-days: 14
