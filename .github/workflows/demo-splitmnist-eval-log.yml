name: SplitMNIST 10x1 benchmark and class oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  splitmnist-weight-reverse-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Restore SplitMNIST dataset cache
        uses: actions/cache@v4
        with:
          path: data
          key: splitmnist-dataset-v1-${{ runner.os }}

      - name: Run SplitMNIST weight reverse-engineering demo
        run: python skill_memory/tests/demo_splitmnist_weight_reverse_engineering.py

      - name: Run oracle-skill retention diagnostic
        run: |
          python skill_memory/tests/demo_splitmnist_oracle_retention.py \
            | tee skill_memory/tests/logs/oracle_skill_retention_${{ github.run_id }}.txt

      - name: Upload routing analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-weight-reverse-engineering-${{ github.run_id }}
          path: |
            skill_memory/tests/logs/weight_reverse_engineering_*.txt
            skill_memory/tests/logs/weight_reverse_engineering_*.csv
            skill_memory/tests/logs/weight_reverse_engineering_*.json
            skill_memory/tests/logs/oracle_skill_retention_*.txt
          if-no-files-found: warn
          retention-days: 14
