name: SplitMNIST Weight Reverse Engineering

on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-class-behavior-fingerprints

jobs:
  splitmnist-weight-reverse-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run SplitMNIST weight reverse-engineering demo
        run: python skill_memory/tests/demo_splitmnist_weight_reverse_engineering.py

      - name: Upload SplitMNIST text log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-weight-reverse-engineering-${{ github.run_id }}
          path: skill_memory/tests/logs/weight_reverse_engineering_*.txt
          if-no-files-found: error
          retention-days: 14
