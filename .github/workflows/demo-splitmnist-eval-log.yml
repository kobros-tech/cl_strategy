name: SplitMNIST Eval Log

on:
  workflow_dispatch:
  push:
    branches:
      - feature/persistent-class-behavior-fingerprints

jobs:
  splitmnist-eval-log:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run SplitMNIST eval log demo
        run: python skill_memory/tests/demo_splitmnist_eval_log.py

      - name: Upload SplitMNIST CSV and text log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-eval-log-${{ github.run_id }}
          path: |
            skill_memory/tests/logs/*.csv
            skill_memory/tests/logs/*.txt
          if-no-files-found: error
          retention-days: 14
