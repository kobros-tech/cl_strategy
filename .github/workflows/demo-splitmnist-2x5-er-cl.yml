name: SplitMNIST 2x5 Skill Memory ER-CL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  download-splitmnist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Restore or download SplitMNIST dataset
        uses: actions/cache@v4
        with:
          path: data
          key: splitmnist-dataset-v1-${{ runner.os }}

      - name: Prepare SplitMNIST 2x5 dataset
        run: |
          python skill_memory/demos/demo_splitmnist_ml_er.py \
            --dataset-root data \
            --n-experiences 2 \
            --download-only

  run-splitmnist-2x5-er-cl:
    needs: download-splitmnist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Restore SplitMNIST dataset cache
        uses: actions/cache@v4
        with:
          path: data
          key: splitmnist-dataset-v1-${{ runner.os }}

      - name: Run Skill Memory with ER-CL evaluation
        run: |
          python skill_memory/demos/demo_splitmnist_ml_er.py \
            --dataset-root data \
            --n-experiences 2 \
            --eval-method cl \
            --max-skills 20 \
            --seed 0 \
            | tee splitmnist_2x5_er_cl_${{ github.run_id }}.txt

      - name: Upload ER-CL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splitmnist-2x5-er-cl-results-${{ github.run_id }}
          path: splitmnist_2x5_er_cl_*.txt
          if-no-files-found: warn
          retention-days: 14
