name: Diagnose CIFAR100 Router

on:
  workflow_dispatch:
    inputs:
      n_experiences:
        description: "Number of CIFAR100 experiences"
        required: false
        default: "20"
      train_samples_per_class:
        description: "Training samples retained per class"
        required: false
        default: "100"
      eval_samples_per_class:
        description: "Evaluation samples retained per class"
        required: false
        default: "100"
      train_epochs:
        description: "Class training epochs"
        required: false
        default: "1"
      reverse_epochs:
        description: "Reverse-router epochs"
        required: false
        default: "30"
      seed:
        description: "Random seed"
        required: false
        default: "0"
      device:
        description: "Torch device"
        required: false
        default: "cpu"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and diagnostics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install torchvision

      - name: Run CIFAR100 routing diagnostic
        run: |
          python scripts/diagnose_cifar100_router.py             --n-experiences "${{ inputs.n_experiences }}"             --train-samples-per-class "${{ inputs.train_samples_per_class }}"             --eval-samples-per-class "${{ inputs.eval_samples_per_class }}"             --train-epochs "${{ inputs.train_epochs }}"             --reverse-epochs "${{ inputs.reverse_epochs }}"             --seed "${{ inputs.seed }}"             --device "${{ inputs.device }}"             --output cifar100_router_diagnostic.json

      - name: Upload routing diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cifar100-router-diagnostic
          path: cifar100_router_diagnostic.json
